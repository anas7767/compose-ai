[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-ai-api"
version = "0.1.0"
description = "FastAPI backend for Compose AI."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "google-genai>=2.6.0,<3.0.0",
  "httpx>=0.27.2",
  "openai>=1.54.0,<2.0.0",
  "ortools>=9.11.0,<10.0.0",
  "PyJWT[crypto]>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyproj>=3.6.0",
  "python-dotenv>=1.0.1",
  "shapely>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0"
]

[project.scripts]
compose-ai-ai-worker = "compose_ai_api.domains.ai_architect.worker:main"
compose-ai-floor-plan-worker = "compose_ai_api.domains.floor_plans.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
